<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Arnoga Mountain View Resort &amp; Spa – Reception</title>
<link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --page:#fefefe; --panel:#fefefe; --brown:#2e1b15; --muted:#8a7a6e; --gold:#c99a4a; --hair:#e6d6b8;
    box-sizing:border-box;
    padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  }
  @media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ --page:#1c120e; } }
  :root[data-theme="dark"]{ --page:#1c120e; }
  *,*::before,*::after{ box-sizing:inherit; }
  html,body{ height:100%; margin:0; }
  body{
    background:var(--page); color:var(--brown);
    font-family:"Quicksand","Century Gothic","Avenir Next",system-ui,sans-serif;
    display:flex; align-items:center; justify-content:center;
    overflow:hidden; user-select:none; -webkit-user-select:none;
  }
  body.idle, body.idle *{ cursor:none !important; }

  .stage{
    width:100%; height:100%;
    background:var(--panel);
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:clamp(12px,4vh,56px);
    padding:4vh 4vw;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]) .stage{ width:96%; height:94%; border-radius:clamp(10px,2vmin,28px); }
  }
  :root[data-theme="dark"] .stage{ width:96%; height:94%; border-radius:clamp(10px,2vmin,28px); }

  .logo{ width:min(90vw, 175vh); }
  .logo svg{ display:block; width:100%; height:auto; }

  .info{
    display:flex; flex-direction:column; align-items:center;
    gap:clamp(6px,1.6vh,22px);
    text-align:center;
  }
  .date{
    font-weight:500;
    font-size:clamp(20px, min(4.2vh, 4.4vw), 64px);
    letter-spacing:.02em;
    margin:0;
  }
  .rule{ width:clamp(60px,10vw,180px); height:2px; background:linear-gradient(90deg,transparent,var(--gold),transparent); border:0; margin:0; }

  .weather{
    display:flex; align-items:center; justify-content:center; flex-wrap:wrap;
    column-gap:clamp(18px,3vw,64px); row-gap:8px;
    font-size:clamp(15px, min(2.7vh, 2.8vw), 40px);
    color:var(--brown);
    transition:opacity .8s ease;
  }
  .weather[hidden]{ display:none; }
  .now{ display:flex; align-items:center; gap:.45em; }
  .now .temp{ font-size:1.7em; font-weight:500; line-height:1; }
  .icon{ width:1.6em; height:1.6em; flex:none; }
  .icon *{ fill:none; stroke:var(--gold); stroke-width:1.6; stroke-linecap:round; stroke-linejoin:round; }
  .day{ display:flex; align-items:center; gap:.4em; color:var(--muted); }
  .day b{ font-weight:600; color:var(--brown); }
  .day .icon{ width:1.25em; height:1.25em; }
  .place{ font-size:.62em; color:var(--muted); letter-spacing:.03em; }

  .hint{
    position:fixed; left:50%; bottom:calc(16px + env(safe-area-inset-bottom,0px));
    transform:translateX(-50%);
    background:var(--brown); color:#f6ead2; font-size:14px;
    padding:8px 14px; border-radius:999px;
    opacity:0; transition:opacity .6s ease; pointer-events:none;
  }
  .hint.show{ opacity:.92; }
  #second{ filter:drop-shadow(0 2px 2px rgba(46,27,21,.25)); }
  @media (prefers-reduced-motion: reduce){ .weather,.hint{ transition:none; } }
</style>
</head>

<script>
(function () {
  /* ---- Impostazioni ---- */
  var TZ  = 'Europe/Rome';
  var LAT = 46.498, LON = 10.225, ELEV = 1870;   // Arnoga (Valdidentro)
  var WEATHER_EVERY_MIN = 15;
  var IDLE_MS = 3000;

  /* ---- Orologio (ora italiana, indipendente dal fuso del dispositivo) ---- */
  var h = document.getElementById('hour'), m = document.getElementById('minute'), s = document.getElementById('second');
  var reduce = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
  var fmt = new Intl.DateTimeFormat('en-GB', { timeZone: TZ, hour: '2-digit', minute: '2-digit', second: '2-digit', hourCycle: 'h23' });
  function romeParts(d) {
    var o = {}; fmt.formatToParts(d).forEach(function (p) { o[p.type] = +p.value; }); return o;
  }
  function drawClock() {
    var d = new Date(), p = romeParts(d);
    var sec = p.second + (reduce ? 0 : d.getMilliseconds() / 1000);
    var min = p.minute + sec / 60, hr = (p.hour % 12) + min / 60;
    s.setAttribute('transform', 'rotate(' + sec * 6 + ')');
    m.setAttribute('transform', 'rotate(' + min * 6 + ')');
    h.setAttribute('transform', 'rotate(' + hr * 30 + ')');
  }
  drawClock();
  if (reduce) setInterval(drawClock, 1000);
  else (function loop() { drawClock(); requestAnimationFrame(loop); })();

  /* ---- Data ---- */
  var dateEl = document.getElementById('date');
  var dfmt = new Intl.DateTimeFormat('it-IT', { timeZone: TZ, weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });
  function drawDate() {
    var t = dfmt.format(new Date());
    if (dateEl.textContent !== t) dateEl.textContent = t.charAt(0).toUpperCase() + t.slice(1);
  }
  drawDate(); setInterval(drawDate, 30000);

  /* ---- Meteo (Open-Meteo, nessuna chiave richiesta) ---- */
  var ICONS = {
    sun:   '<circle cx="16" cy="16" r="5.5"/><path d="M16 3v4M16 25v4M3 16h4M25 16h4M6.8 6.8l2.8 2.8M22.4 22.4l2.8 2.8M6.8 25.2l2.8-2.8M22.4 9.6l2.8-2.8"/>',
    moon:  '<path d="M21.5 20.5A9 9 0 0 1 12 6.2a9.5 9.5 0 1 0 13.6 11.6 9 9 0 0 1-4.1 2.7z"/>',
    part:  '<circle cx="12" cy="11" r="4.5"/><path d="M12 2.5v2M4.5 11h-2M6.6 5.6l-1.4-1.4M17.4 5.6l1.4-1.4"/><path d="M10 26h13a5 5 0 0 0 0-10 7 7 0 0 0-13.3 2.3A4 4 0 0 0 10 26z"/>',
    cloud: '<path d="M9 25h14a6 6 0 0 0 0-12 8 8 0 0 0-15.4 2.6A4.7 4.7 0 0 0 9 25z"/>',
    fog:   '<path d="M8 17h14a5 5 0 0 0 0-10 7 7 0 0 0-13.4 2.2A4 4 0 0 0 8 17z"/><path d="M5 22h22M8 27h16"/>',
    rain:  '<path d="M9 20h14a5.5 5.5 0 0 0 0-11 7.5 7.5 0 0 0-14.4 2.4A4.3 4.3 0 0 0 9 20z"/><path d="M11 23l-1.5 4M17 23l-1.5 4M23 23l-1.5 4"/>',
    snow:  '<path d="M9 19h14a5.5 5.5 0 0 0 0-11 7.5 7.5 0 0 0-14.4 2.4A4.3 4.3 0 0 0 9 19z"/><path d="M10 24v4M8 26h4M16 23v4M14 25h4M22 24v4M20 26h4"/>',
    storm: '<path d="M9 19h14a5.5 5.5 0 0 0 0-11 7.5 7.5 0 0 0-14.4 2.4A4.3 4.3 0 0 0 9 19z"/><path d="M17 20l-4 6h5l-3 5"/>'
  };
  function describe(code, isDay) {
    if (code === 0) return [isDay ? 'sun' : 'moon', 'Sereno'];
    if (code === 1) return [isDay ? 'sun' : 'moon', 'Prevalentemente sereno'];
    if (code === 2) return ['part', 'Parzialmente nuvoloso'];
    if (code === 3) return ['cloud', 'Coperto'];
    if (code === 45 || code === 48) return ['fog', 'Nebbia'];
    if (code >= 51 && code <= 57) return ['rain', 'Pioviggine'];
    if (code >= 61 && code <= 67) return ['rain', 'Pioggia'];
    if (code >= 71 && code <= 77) return ['snow', 'Neve'];
    if (code >= 80 && code <= 82) return ['rain', 'Rovesci'];
    if (code === 85 || code === 86) return ['snow', 'Rovesci di neve'];
    if (code >= 95) return ['storm', 'Temporale'];
    return ['cloud', ''];
  }
  var wEl = document.getElementById('weather');
  function deg(v) { return Math.round(v) + '°'; }
  function loadWeather() {
    var url = 'https://api.open-meteo.com/v1/forecast?latitude=' + LAT + '&longitude=' + LON + '&elevation=' + ELEV +
      '&current=temperature_2m,weather_code,is_day&daily=weather_code,temperature_2m_max,temperature_2m_min' +
      '&timezone=' + encodeURIComponent(TZ) + '&forecast_days=2';
    fetch(url).then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); })
      .then(function (d) {
        var c = describe(d.current.weather_code, d.current.is_day === 1);
        var t = describe(d.daily.weather_code[1], true);
        document.getElementById('nowIcon').innerHTML = ICONS[c[0]];
        document.getElementById('nowTemp').textContent = deg(d.current.temperature_2m);
        document.getElementById('nowText').textContent = c[1];
        document.getElementById('todayRange').textContent = deg(d.daily.temperature_2m_min[0]) + ' / ' + deg(d.daily.temperature_2m_max[0]);
        document.getElementById('tomIcon').innerHTML = ICONS[t[0]];
        document.getElementById('tomRange').textContent = deg(d.daily.temperature_2m_min[1]) + ' / ' + deg(d.daily.temperature_2m_max[1]);
        wEl.hidden = false;
      })
      .catch(function () { /* senza rete l'ultimo meteo valido resta visibile; se non c'è mai stato resta nascosto */ });
  }
  loadWeather(); setInterval(loadWeather, WEATHER_EVERY_MIN * 60000);

  /* ---- Cursore nascosto dopo inattività ---- */
  var idleTimer;
  function wake() { document.body.classList.remove('idle'); clearTimeout(idleTimer); idleTimer = setTimeout(function () { document.body.classList.add('idle'); }, IDLE_MS); }
  ['mousemove', 'mousedown', 'touchstart', 'keydown'].forEach(function (e) { addEventListener(e, wake, { passive: true }); });
  wake();

  /* ---- Schermo intero con doppio clic / doppio tocco, oppure tasto F ---- */
  var hint = document.getElementById('hint');
  function toggleFs() {
    var el = document.documentElement;
    if (!document.fullscreenElement) { if (el.requestFullscreen) el.requestFullscreen().catch(function () {}); }
    else if (document.exitFullscreen) document.exitFullscreen();
  }
  addEventListener('dblclick', toggleFs);
  addEventListener('keydown', function (e) { if (e.key === 'f' || e.key === 'F') toggleFs(); });
  if (!document.fullscreenElement) {
    hint.classList.add('show');
    setTimeout(function () { hint.classList.remove('show'); }, 5000);
  }

  /* ---- Schermo sempre acceso (dove supportato) ---- */
  var lock = null;
  function keepAwake() {
    if (!('wakeLock' in navigator) || document.visibilityState !== 'visible') return;
    navigator.wakeLock.request('screen').then(function (l) { lock = l; }).catch(function () {});
  }
  document.addEventListener('visibilitychange', keepAwake);
  keepAwake();
})();
</script>
